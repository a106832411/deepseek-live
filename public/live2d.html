<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鲸live · 皮套</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; }
  #err { position: fixed; left: 8px; top: 8px; color: #ff9aa8; font: 13px/1.5 "Microsoft YaHei", sans-serif; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<script src="/live2d/vendor/live2dcubismcore.min.js"></script>
<script src="/live2d/vendor/pixi.min.js"></script>
<script src="/live2d/vendor/pixi-live2d-display.cubism4.min.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  // 没显式传 ?model= 时，用控制台里选中的模型（config.live2d.model）
  let modelUrl = q.get('model') || '';
  if (!modelUrl) {
    try {
      const r = await fetch('/api/live2d/models', { cache: 'no-store' });
      const j = await r.json();
      modelUrl = (j && j.current) || '';
    } catch (e) {}
  }
  const MODEL_URL = modelUrl || '/live2d/models/avatar/c_0120.model3.json';
  const SCALE = Number(q.get('scale') || 0.92);
  const err = document.getElementById('err');
  function showErr(e) { err.textContent = String((e && e.stack) || e); }
  window.addEventListener('error', (e) => showErr(e.error || e.message));

  try {
    const { Application, live2d } = PIXI;
    const app = new Application({
      view: document.createElement('canvas'),
      autoStart: true,
      backgroundAlpha: 0,
      antialias: true,
      powerPreference: 'high-performance',
      resizeTo: window
    });
    document.body.appendChild(app.view);

    const model = await live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
    app.stage.addChild(model);

    // 自动缩放、脚底对齐底部居中
    function fit() {
      const im = model.internalModel;
      const mw = im.width || im.originalWidth || 1000;
      const mh = im.height || im.originalHeight || 1000;
      const s = (app.screen.height * SCALE) / mh;
      model.scale.set(s);
      model.x = (app.screen.width - mw * s) / 2;
      model.y = app.screen.height - mh * s;
    }
    fit();
    window.addEventListener('resize', fit);

    // ---- 说话口型 + 表情 ----
    let speaking = false;
    let mouthPhase = 0;
    let mouthTarget = 0;
    let mouthBoost = 1;      // 清唱时嘴张更大一点
    let speakTimer = null;
    // 真口型：后端会推 speak_audio（时长 + 音量包络），按时间轴驱动嘴型
    let envData = null;
    let envFrameMs = 30;
    let envStartAt = 0;
    let envMode = false;
    const ENV_DELAY_MS = 220;   // 播放子进程启动的固定延迟补偿
    const core = () => model.internalModel.coreModel;
    function setMouth(v) {
      try { core().setParameterValueById('ParamMouthOpenY', Math.max(0, Math.min(1, v))); } catch (e) {}
    }
    function startEnvelope(j) {
      const arr = Array.isArray(j.envelope) && j.envelope.length ? j.envelope : null;
      if (!arr) return false;
      envData = arr;
      envFrameMs = Number(j.frameMs) || 30;
      envStartAt = performance.now() + ENV_DELAY_MS;
      envMode = true;
      speaking = true;
      mouthBoost = 1;
      clearTimeout(speakTimer);
      // 兜底：包络走完还没收到 speak_end，也自动闭嘴
      speakTimer = setTimeout(() => {
        envMode = false;
        speaking = false;
        mouthBoost = 1;
      }, Math.max(600, Number(j.duration || 1) * 1000 + ENV_DELAY_MS + 300));
      return true;
    }
    app.ticker.add(() => {
      if (envMode && envData) {
        const t = performance.now() - envStartAt;
        if (t < 0) {
          mouthTarget = 0;
        } else {
          const idx = Math.min(envData.length - 1, Math.floor(t / envFrameMs));
          mouthTarget = Math.max(0, Math.min(1, (envData[idx] || 0) * 0.95));
          if (idx >= envData.length - 1 && t > envData.length * envFrameMs + 150) {
            envMode = false;
            speaking = false;
          }
        }
        setMouth(mouthTarget);
        return;
      }
      if (speaking) {
        mouthPhase += 0.35;
        mouthTarget = (0.35 + 0.45 * Math.abs(Math.sin(mouthPhase))) * mouthBoost;
      } else {
        mouthTarget = 0;
      }
      setMouth(mouthTarget * (0.6 + 0.4 * Math.sin(mouthPhase * 0.7)));
    });
    function holdMouth(ms) {
      speaking = true;
      mouthPhase = 0;
      clearTimeout(speakTimer);
      speakTimer = setTimeout(() => { speaking = false; mouthBoost = 1; }, ms);
    }

    let exprNames = [];
    try {
      const j = await (await fetch(MODEL_URL)).json();
      if (j.FileReferences && j.FileReferences.Expressions) exprNames = j.FileReferences.Expressions.map((x) => x.Name);
    } catch (e) {}

    function randomExpression() {
      if (!exprNames.length) return;
      const n = exprNames[Math.floor(Math.random() * exprNames.length)];
      try { model.expression(n); } catch (e) {}
    }

    // ---- 接鲸live WS ----
    function connectWs() {
      try {
        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
        ws.onmessage = (m) => {
          let j;
          try { j = JSON.parse(m.data); } catch (e) { return; }
          if (j.kind === 'speak_audio') {
            // 真口型：按真实音频包络张嘴（比"按字数估时长"准得多）
            if (!startEnvelope(j)) {
              // 包络缺失时退回旧的估时长方案
              holdMouth(Math.min(9000, 800 + String(j.text || '').length * 140));
            }
            if (Math.random() < 0.5) randomExpression();
          } else if (j.kind === 'speak' || j.kind === 'reply') {
            // 只挑表情；嘴型等 speak_audio（音频真的开始播）再动，避免"合成中就在动嘴"
            if (Math.random() < 0.35) randomExpression();
          } else if (j.kind === 'speak_end') {
            speaking = false;
            envMode = false;
            mouthBoost = 1;
          } else if (j.kind === 'sing') {
            // 清唱：每句歌词按实际时长保持张嘴（dur 由后端 timing 给出）
            if (j.action === 'line') {
              mouthBoost = 1.15;
              const dur = Number(j.dur) || 0;
              const ms = dur > 0 ? dur * 1000 + 260 : Math.min(9000, 900 + String(j.text || '').length * 240);
              holdMouth(ms);
              if (Math.random() < 0.35) randomExpression();
            } else if (j.action === 'start') {
              mouthBoost = 1.15;
              holdMouth(900);
            } else if (j.action === 'end') {
              speaking = false;
              mouthBoost = 1;
              clearTimeout(speakTimer);
            }
          }
        };
        ws.onclose = () => setTimeout(connectWs, 3000);
      } catch (e) {}
    }
    connectWs();

    // 空闲时随机眨眼/表情
    setInterval(() => { if (!speaking && Math.random() < 0.25) randomExpression(); }, 12000);

    err.textContent = '';
    window.__l2dReady = true;
  } catch (e) {
    showErr(e);
  }
})();
</script>
</body>
</html>
