<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鲸live · 星露谷 AI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    color: #ece7d8;
    display: flex; align-items: flex-start; justify-content: flex-start;
  }
  .panel {
    background: rgba(14, 13, 16, .82);
    border: 1px solid rgba(216, 178, 90, .55);
    border-radius: 14px;
    padding: 14px 18px;
    min-width: 420px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
    backdrop-filter: blur(6px);
  }
  .title { color: #d8b25a; font-weight: 700; font-size: 15px; letter-spacing: .5px; margin-bottom: 8px; }
  .status { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .ok { color: #6fcf7f; } .bad { color: #e06666; }
  .info { font-size: 13px; line-height: 1.7; color: #cfc9b8; white-space: pre-line; }
  .task { color: #d8b25a; font-size: 13px; margin-top: 8px; line-height: 1.5; }
  .logs { color: #8a857a; font-size: 11.5px; margin-top: 8px; line-height: 1.55; white-space: pre-line; }
</style>
</head>
<body>
  <div class="panel">
    <div class="title">鲸live · 星露谷 AI</div>
    <div class="status" id="status">连接中…</div>
    <div class="info" id="info"></div>
    <div class="task" id="task"></div>
    <div class="logs" id="logs"></div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
function hhmm(t) {
  const hh = Math.floor(t / 100) % 24, mm = t % 100;
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}
async function tick() {
  try {
    const r = await fetch('/api/stardew', { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok) {
      $('status').textContent = '● 游戏未连接';
      $('status').className = 'status bad';
      $('info').textContent = '等待游戏启动…';
      return;
    }
    const fresh = d.age < 30;
    $('status').textContent = fresh ? '● 运行中' : '● 数据不更新';
    $('status').className = 'status ' + (fresh ? 'ok' : 'bad');
    $('info').textContent =
      `位置 ${d.location}  (${d.tile ? d.tile.x : '?'},${d.tile ? d.tile.y : '?'})\n` +
      `第 ${d.day} 天  ${hhmm(d.time || 0)}   金币 ${d.money}\n` +
      `守护进程 ${d.guardFresh ? '在跑' : '未确认'} · 数据 ${Math.round(d.age)}s 前`;
    const lines = d.guardLines || [];
    let task = '';
    for (let i = lines.length - 1; i >= 0; i--) {
      if (/自动干活|挖矿|钓鱼|农场|跨天/.test(lines[i])) { task = lines[i]; break; }
    }
    $('task').textContent = '现在：' + (task || '空闲/待命');
    $('logs').textContent = lines.join('\n');
  } catch (e) {
    $('status').textContent = '● 服务未连接';
    $('status').className = 'status bad';
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
